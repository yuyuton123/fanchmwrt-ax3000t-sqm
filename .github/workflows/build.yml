name: Build FanchmWrt AX3000T SQM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: free-disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: checkout-fanchmwrt
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          path: openwrt
          fetch-depth: 1

      - name: install-deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-pip rsync swig unzip zlib1g-dev file wget libelf-dev bc

      - name: feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: configure
        working-directory: openwrt
        run: |
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y"
            echo "CONFIG_PACKAGE_kmod-sched-core=y"
            echo "CONFIG_PACKAGE_kmod-sched-cake=y"
            echo "CONFIG_PACKAGE_kmod-sched-netem=y"
            echo "CONFIG_PACKAGE_kmod-ifb=y"
            echo "CONFIG_PACKAGE_sqm-scripts=y"
            echo "CONFIG_PACKAGE_sqm-scripts-extra=y"
            echo "CONFIG_PACKAGE_luci-app-sqm=y"
            echo "CONFIG_PACKAGE_tc-full=y"
            echo "CONFIG_PACKAGE_iproute2=y"
          } > .config
          make defconfig > defconfig.log 2>&1 || true
          echo "==== defconfig 输出末 40 行 ===="
          tail -n 40 defconfig.log || true
          echo "==== target ===="
          grep -E '^CONFIG_TARGET_mediatek' .config || true
          echo "==== qos ===="
          grep -E '^CONFIG_PACKAGE_(sqm-scripts|sqm-scripts-extra|luci-app-sqm|kmod-sched-cake|kmod-sched-core|kmod-ifb|tc-full|iproute2)' .config || true
          if ! grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y' .config; then
            echo 'ERROR: device profile not selected'; exit 1
          fi
          if ! grep -q '^CONFIG_PACKAGE_luci-app-sqm=y' .config; then
            echo 'ERROR: luci-app-sqm not enabled'; exit 1
          fi
          echo '==== config ok ===='

      - name: build
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log | tail -n 300

      - name: upload-firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-sqm
          path: openwrt/bin/targets/mediatek/filogic/*sysupgrade*.bin
          if-no-files-found: error

      - name: publish-release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh openwrt/bin/targets/mediatek/filogic/ || true
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "FanchmWrt AX3000T + SQM ($TAG)" \
            --notes "FanchmWrt self-build for Xiaomi AX3000T (stock layout, xiaomi_mi-router-ax3000t) with luci-app-sqm / CAKE / IFB." \
            openwrt/bin/targets/mediatek/filogic/*sysupgrade*.bin

      - name: upload-log-on-failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            openwrt/build.log
            openwrt/defconfig.log
            openwrt/.config
          if-no-files-found: warn
