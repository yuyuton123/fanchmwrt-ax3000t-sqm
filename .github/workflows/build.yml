name: Build FanchmWrt AX3000T SQM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: free-disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: checkout-fanchmwrt
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          path: openwrt
          fetch-depth: 1

      - name: install-deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget libelf-dev bc

      - name: feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: configure
        run: |
          cp config.seed openwrt/.config
          cd openwrt
          make defconfig > /tmp/defconfig.log 2>&1 || true
          echo '==== target ===='
          grep -E '^CONFIG_TARGET_mediatek(_filogic)?=' .config || true
          if ! grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y' .config; then
            echo 'ERROR: device profile not selected'; grep -iE 'ax3000t' .config || true; exit 1
          fi
          echo '==== qos ===='
          grep -E '^CONFIG_PACKAGE_(sqm-scripts|sqm-scripts-extra|luci-app-sqm|kmod-sched-cake|kmod-sched-core|kmod-ifb|tc-full|iproute2)=' .config || true
          if ! grep -q '^CONFIG_PACKAGE_luci-app-sqm=y' .config; then
            echo 'ERROR: luci-app-sqm not enabled'; exit 1
          fi
          echo '==== config ok ===='

      - name: build
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log | tail -n 300

      - name: upload-firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-sqm
          path: openwrt/bin/targets/mediatek/filogic/*sysupgrade*.bin
          if-no-files-found: error

      - name: upload-log-on-failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            openwrt/build.log
            /tmp/defconfig.log
          if-no-files-found: warn
