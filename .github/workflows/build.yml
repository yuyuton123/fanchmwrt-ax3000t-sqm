name: Build FanchmWrt AX3000T SQM

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: checkout-self
        uses: actions/checkout@v4

      - name: free-disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: checkout-fanchmwrt
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          path: openwrt
          fetch-depth: 1

      - name: install-deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-pip rsync swig unzip zlib1g-dev file wget libelf-dev bc

      - name: feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: configure
        working-directory: openwrt
        run: |
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y"
            echo ""
            echo "### FanchmWrt 私有套件（行为管理 / 应用中心 / 主题）"
            echo "CONFIG_PACKAGE_kmod-fwx=y"
            echo "CONFIG_PACKAGE_fwxd=y"
            echo "CONFIG_PACKAGE_libfwx_common=y"
            echo "CONFIG_PACKAGE_luci-theme-fanchmwrt=y"
            echo ""
            echo "### SQM / CAKE"
            echo "CONFIG_PACKAGE_kmod-sched-core=y"
            echo "CONFIG_PACKAGE_kmod-sched-cake=y"
            echo "CONFIG_PACKAGE_kmod-sched-netem=y"
            echo "CONFIG_PACKAGE_kmod-ifb=y"
            echo "CONFIG_PACKAGE_sqm-scripts=y"
            echo "CONFIG_PACKAGE_luci-app-sqm=y"
            echo ""
            echo "### 单设备 / 分级 QoS"
            echo "CONFIG_PACKAGE_qos-scripts=y"
            echo "CONFIG_PACKAGE_luci-app-qos=y"
            echo "CONFIG_PACKAGE_tc-full=y"
            echo "CONFIG_PACKAGE_iproute2=y"
            echo ""
            echo "### 统计与工具"
            echo "CONFIG_PACKAGE_nlbwmon=y"
            echo "CONFIG_PACKAGE_luci-app-nlbwmon=y"
            echo "CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-qos-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y"
            echo "CONFIG_PACKAGE_curl=y"
          } > .config
          make defconfig > defconfig.log 2>&1 || true
          echo "==== 配置检查 ===="
          for p in kmod-fwx fwxd libfwx_common luci-theme-fanchmwrt kmod-sched-cake kmod-ifb tc-full iproute2 sqm-scripts luci-app-sqm qos-scripts luci-app-qos nlbwmon luci-app-nlbwmon curl; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          echo "==== target 符号 ===="
          grep -E '^CONFIG_TARGET_mediatek' .config | head -20 || true
          if ! grep -q 'CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y' .config; then
            echo 'ERROR: device profile not selected'; head -30 defconfig.log; exit 1
          fi
          echo '==== config ok ===='

      - name: build
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log | tail -n 300

      - name: upload-firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-full
          path: openwrt/bin/targets/mediatek/filogic/*sysupgrade*.bin
          if-no-files-found: error

      - name: publish-release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="full-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "FanchmWrt AX3000T 完整版 + 限速 ($TAG)" \
            --notes "保留 FanchmWrt 私有套件(kmod-fwx/fwxd/主题) + SQM/CAKE + qos-scripts(单设备限速) + nlbwmon。" \
            openwrt/bin/targets/mediatek/filogic/*sysupgrade*.bin

      - name: dump-fail-log
        if: failure()
        run: |
          { echo '# build failure log'; echo ''; echo '## build.log tail (250)'; tail -n 250 openwrt/build.log 2>/dev/null || echo '(no build.log)'; echo ''; echo '## defconfig.log tail'; tail -n 40 openwrt/defconfig.log 2>/dev/null || echo '(none)'; echo ''; echo '## .config package lines'; grep -E '^CONFIG_PACKAGE_(kmod-fwx|fwxd|libfwx|luci-theme|qos|sqm|nlbw|tc-|iproute2)' openwrt/.config 2>/dev/null || echo '(none)'; } > build-fail.md
          git config --local user.name "ci-bot"
          git config --local user.email "ci@example.com"
          git add build-fail.md
          git commit -m "ci: dump failure log" || true
          git push || true
