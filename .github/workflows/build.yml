name: Build FanchmWrt AX3000T SQM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: free-disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: checkout-fanchmwrt
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          path: openwrt
          fetch-depth: 1

      - name: install-deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libssl-dev python3-setuptools python3-pip rsync swig unzip zlib1g-dev file wget libelf-dev bc

      - name: feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: configure
        working-directory: openwrt
        run: |
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y"
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
            echo "CONFIG_TARGET_ROOTFS_INITRAMFS=y"
            echo ""
            echo "### FanchmWrt 私有套件（行为管理 / 应用中心 / 主题）"
            echo "CONFIG_PACKAGE_kmod-fwx=y"
            echo "CONFIG_PACKAGE_fwxd=y"
            echo "CONFIG_PACKAGE_libfwx_common=y"
            echo "CONFIG_PACKAGE_luci-theme-fanchmwrt=y"
            echo "CONFIG_PACKAGE_kmod-shortcut-fe=y"
            echo "CONFIG_PACKAGE_kmod-nft-fullcone=y"
            echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y"
            echo "CONFIG_PACKAGE_kmod-ipt-fullconenat=y"
            echo ""
            echo "### 限速：整链路 SQM/CAKE"
            echo "CONFIG_PACKAGE_kmod-sched-core=y"
            echo "CONFIG_PACKAGE_kmod-sched-cake=y"
            echo "CONFIG_PACKAGE_kmod-sched-netem=y"
            echo "CONFIG_PACKAGE_kmod-ifb=y"
            echo "CONFIG_PACKAGE_sqm-scripts=y"
            echo "CONFIG_PACKAGE_luci-app-sqm=y"
            echo ""
            echo "### 限速：单设备/分级 QoS"
            echo "CONFIG_PACKAGE_qos-scripts=y"
            echo "CONFIG_PACKAGE_luci-app-qos=y"
            echo "CONFIG_PACKAGE_qosify=y"
            echo "CONFIG_PACKAGE_tc-full=y"
            echo "CONFIG_PACKAGE_iproute2=y"
            echo ""
            echo "### 流量统计"
            echo "CONFIG_PACKAGE_nlbwmon=y"
            echo "CONFIG_PACKAGE_luci-app-nlbwmon=y"
            echo "CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-qos-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y"
            echo "CONFIG_PACKAGE_curl=y"
          } > .config
          make defconfig > defconfig.log 2>&1 || true
          echo "==== 配置检查 ===="
          for p in kmod-fwx fwxd libfwx_common luci-theme-fanchmwrt kmod-shortcut-fe kmod-nft-fullcone kmod-sched-cake kmod-ifb tc-full iproute2 sqm-scripts luci-app-sqm qos-scripts luci-app-qos qosify nlbwmon luci-app-nlbwmon curl; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          if ! grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y' .config; then
            echo 'ERROR: device profile not selected'; exit 1
          fi
          if ! grep -q '^CONFIG_PACKAGE_luci-app-sqm=y' .config; then
            echo 'ERROR: luci-app-sqm not enabled'; exit 1
          fi
          if ! grep -q '^CONFIG_PACKAGE_luci-app-qos=y' .config; then
            echo 'ERROR: luci-app-qos not enabled'; exit 1
          fi
          echo '==== config ok ===='

      - name: build
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log | tail -n 300

      - name: upload-firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ax3000t-full
          path: openwrt/bin/targets/mediatek/filogic/*sysupgrade*.bin
          if-no-files-found: error

      - name: publish-release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh openwrt/bin/targets/mediatek/filogic/ || true
          TAG="full-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "FanchmWrt AX3000T 完整版 + 限速 ($TAG)" \
            --notes "自编译：保留 FanchmWrt 私有套件(fwx 行为管理/应用中心/主题) + SQM/CAKE + qos-scripts(单设备限速) + nlbwmon。" \
            openwrt/bin/targets/mediatek/filogic/*sysupgrade*.bin

      - name: upload-log-on-failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            openwrt/build.log
            openwrt/defconfig.log
            openwrt/.config
          if-no-files-found: warn
